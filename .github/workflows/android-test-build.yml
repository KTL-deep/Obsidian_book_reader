name: Build Book Reader Custom

on:
  push:
    branches: [feat/book-reader-custom, feat/pdf-extraction-cache]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: node --test tests/*.test.js
      - name: Build
        run: npm run build
      - name: Prepare installation package
        run: |
          mkdir -p dist/ktl-book-reader
          cp main.js manifest.json styles.css dist/ktl-book-reader/
          cd dist
          zip -r ktl-book-reader-android.zip book-reader-test
      - name: Upload Android install files
        uses: actions/upload-artifact@v4
        with:
          name: ktl-book-reader-android
          path: dist/ktl-book-reader-android.zip
          if-no-files-found: error
